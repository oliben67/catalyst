name: Deployment Rules

on:
  pull_request:
  push:
    branches:
      - development

jobs:
  validate-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate catalyst deployment structure
        run: python3 scripts/check_deployment.py
      - name: Validate command parity with CODE-OF-CONDUCT.md §4
        run: python3 scripts/check_command_parity.py
