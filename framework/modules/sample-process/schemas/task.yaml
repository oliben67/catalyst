id_prefix: TASK
name: Task
plural_name: Tasks
folder: tasks
grounding: required
grounding_field: Policy

fields:
  - name: ID
    kind: text
    required: true
  - name: Status
    kind: enum
    required: true
    allowed_values:
      - Open
      - In-Progress
      - Done
  - name: Policy
    kind: ref
    required: true
    target_type: POLICY

workflow:
  initial: Open
  states:
    - Open
    - In-Progress
    - Done
  closed_states:
    - Done
